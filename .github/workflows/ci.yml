name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  api:
    name: API quality and security
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.48-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: 3.12.16
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.9
      - name: Sync locked dependencies
        working-directory: services/api
        run: uv sync --locked --group dev
      - name: Lint
        working-directory: services/api
        run: uv run ruff check app tests
      - name: Check formatting
        working-directory: services/api
        run: uv run ruff format --check app tests
      - name: Type check
        working-directory: services/api
        run: uv run mypy app
      - name: Unit tests
        working-directory: services/api
        run: uv run pytest
      - name: MongoDB integration tests
        working-directory: services/api
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/ahoya_test
        run: uv run pytest -m integration -o addopts=""
      - name: Dependency audit
        working-directory: services/api
        run: uv run pip-audit --strict

  web:
    name: Web quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit
        run: npm run audit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build development and production images
        run: |
          docker compose build api web
          docker build --file services/api/Dockerfile --target runtime --tag ahoya-api:ci .
          docker build --file apps/web/Dockerfile --target runner --tag ahoya-web:ci .
