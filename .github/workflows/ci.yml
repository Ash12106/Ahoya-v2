name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  api:
    name: API quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: 3.12.16
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.9
      - name: Sync locked dependencies
        working-directory: services/api
        run: uv sync --locked --group dev
      - name: Lint
        working-directory: services/api
        run: uv run ruff check app tests
      - name: Check formatting
        working-directory: services/api
        run: uv run ruff format --check app tests
      - name: Type check
        working-directory: services/api
        run: uv run mypy app
      - name: Unit tests
        working-directory: services/api
        run: uv run pytest
      - name: Start MongoDB 7 replica set
        run: |
          docker run --detach --name ahoya-ci-mongo \
            --publish 27017:27017 \
            mongo:7.0.48-jammy \
            mongod --replSet rs0 --bind_ip_all

          for attempt in $(seq 1 40); do
            if docker exec ahoya-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec ahoya-ci-mongo mongosh --quiet --eval 'try { rs.status(); } catch (error) { if (error.codeName !== "NotYetInitialized") throw error; rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}); }'

          for attempt in $(seq 1 40); do
            if docker exec ahoya-ci-mongo mongosh --quiet --eval 'try { const state = rs.status(); print(state.members.some((member) => member.stateStr === "PRIMARY") ? "PRIMARY" : "WAIT"); } catch (error) { print("WAIT"); }' | grep -q '^PRIMARY$'; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: MongoDB integration tests
        working-directory: services/api
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/ahoya_test?replicaSet=rs0
        run: uv run pytest -m integration -o addopts=""
      - name: Dependency audit
        working-directory: services/api
        run: uv run pip-audit --strict

  web:
    name: Web quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit
        run: npm run audit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build development and production images
        run: |
          docker compose build api web
          docker build --file services/api/Dockerfile --target runtime --tag ahoya-api:ci .
          docker build --file apps/web/Dockerfile --target runner --tag ahoya-web:ci .

  publish-images:
    name: Publish ${{ matrix.component }} image
    if: github.event_name == 'push'
    needs: [secret-scan, api, web, containers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
            target: runtime
          - component: web
            dockerfile: apps/web/Dockerfile
            target: runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Normalize image namespace
        id: image-owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ghcr.io/${{ steps.image-owner.outputs.owner }}/ahoya-v2-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
