services:
  - type: web
    name: ahoya-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    dockerCommand: sh -c 'uvicorn app.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /health/db
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ahoya
      - key: KRAWL_HMAC_SECRET
        sync: false
      - key: CLOUDFLARE_ORIGIN_TOKEN
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: ahoya-web
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    dockerCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUDFLARE_ORIGIN_TOKEN
        sync: false
