name: ahoya

services:
  mongo:
    image: mongo:7.0.48-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ahoya
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-dev-password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /data/configdb:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      APP_ENV: development
      MONGODB_URI: "${MONGODB_URI:-mongodb://ahoya:${MONGO_ROOT_PASSWORD:-local-dev-password}@mongo:27017/ahoya?authSource=admin}"
      DATABASE_NAME: ${DATABASE_NAME:-ahoya}
      KRAWL_HMAC_SECRET: ${KRAWL_HMAC_SECRET:-local-development-secret-change-before-any-shared-use}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./services/api/app:/app/app:ro
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ./apps/web/app:/app/app:ro
      - ./apps/web/public:/app/public:ro
      - ./apps/web/proxy.ts:/app/proxy.ts:ro
      - ./apps/web/next-env.d.ts:/app/next-env.d.ts:rw
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:
